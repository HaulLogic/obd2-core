# Simplified embedded spec: 2004.5 Duramax LLY
# Matches VehicleSpec serde layout. Subset of full spec for binary embedding.

spec_version: "1.0"

identity:
  name: "2004.5 GM Duramax LLY"
  model_years: [2004, 2005]
  makes:
    - Chevrolet
    - GMC
  models:
    - Silverado 2500HD
    - Silverado 3500
    - Sierra 2500HD
    - Sierra 3500
  engine:
    code: LLY
    displacement_l: 6.6
    cylinders: 8
    layout: V8
    aspiration: turbocharged
    fuel_type: diesel
    fuel_system: "Bosch common-rail direct injection"
    compression_ratio: 17.5
    max_power_kw: 224.0
    max_torque_nm: 895.0
    redline_rpm: 3250
    idle_rpm_warm: 680
    idle_rpm_cold: 780
    firing_order: [1, 2, 7, 8, 4, 5, 6, 3]
    ecm_hardware: "Bosch E60"
  transmission:
    model: "Allison 1000 (5-speed)"
    transmission_type: !Geared
      speeds: 5
      gear_ratios:
        - ["1st", 3.10]
        - ["2nd", 1.81]
        - ["3rd", 1.41]
        - ["4th", 1.00]
        - ["5th", 0.71]
    fluid_capacity_l: 13.5
  vin_match:
    vin_8th_digit: ['2']
    wmi_prefixes:
      - "1GC"
      - "1GT"
      - "2GC"
    year_range: [2004, 2005]

communication:
  buses:
    - id: j1850vpw
      protocol: J1850Vpw
      speed_bps: 10400
      modules:
        - id: ecm
          name: "Engine Control Module"
          address: !J1850
            node: 0x10
            header: [0x6C, 0x10, 0xF1]
          bus: j1850vpw
        - id: tcm
          name: "Transmission Control Module"
          address: !J1850
            node: 0x18
            header: [0x6C, 0x18, 0xF1]
          bus: j1850vpw
        - id: ficm
          name: "Fuel Injection Control Module"
          address: !J1850
            node: 0x11
            header: [0x6C, 0x11, 0xF1]
          bus: j1850vpw
        - id: bcm
          name: "Body Control Module"
          address: !J1850
            node: 0x40
            header: [0x6C, 0x40, 0xF1]
          bus: j1850vpw
        - id: abs
          name: "Electronic Brake Control Module"
          address: !J1850
            node: 0x29
            header: [0x6C, 0x29, 0xF1]
          bus: j1850vpw
      description: "Class 2 J1850 VPW bus"
  elm327_protocol_code: "2"

thresholds:
  engine:
    - name: coolant_temp
      threshold:
        min: -40.0
        max: 120.0
        warning_high: 105.0
        critical_high: 115.0
        unit: "\u00B0C"
    - name: oil_temp
      threshold:
        min: -40.0
        max: 150.0
        warning_high: 120.0
        critical_high: 135.0
        unit: "\u00B0C"
    - name: rpm
      threshold:
        min: 0.0
        max: 3500.0
        critical_high: 3250.0
        unit: RPM

polling_groups:
  - name: critical
    description: "Safety-critical parameters polled every loop"
    target_interval_ms: 500
    steps:
      - target: broadcast
        standard_pids: [0x05, 0x0C, 0x0D]
        enhanced_pids: []

